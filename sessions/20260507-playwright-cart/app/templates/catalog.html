<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Catalogue</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
    nav a { text-decoration: none; color: #333; font-weight: bold; }
    #products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    article { border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; }
    article h2 { margin: 0 0 0.5rem; font-size: 1.1rem; }
    .price { font-size: 1.2rem; font-weight: bold; color: #2a7ae2; margin: 0.5rem 0 1rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 0.25rem; }
    input[type="number"] { width: 60px; padding: 0.3rem; margin-right: 0.5rem; }
    button { padding: 0.5rem 1rem; background: #2a7ae2; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Catalogue</a>
    <a href="/cart" id="cart-link">Panier ({{ cart_count }})</a>
  </nav>
  <main>
    <h1>Catalogue</h1>
    <div id="products">
      {% for product in products %}
      <article id="product-{{ product.id }}">
        <h2>{{ product.name }}</h2>
        <p class="price">{{ "%.2f"|format(product.price)|replace(".", ",") }} €</p>
        <form method="POST" action="/cart/add">
          <input type="hidden" name="product_id" value="{{ product.id }}">
          <label for="qty-{{ product.id }}">Quantité</label>
          <input
            type="number"
            id="qty-{{ product.id }}"
            name="quantity"
            value="1"
            min="1"
            max="10"
            aria-label="Quantité pour {{ product.name }}"
          >
          <button type="submit">Ajouter au panier</button>
        </form>
      </article>
      {% endfor %}
    </div>
  </main>
</body>
</html>
