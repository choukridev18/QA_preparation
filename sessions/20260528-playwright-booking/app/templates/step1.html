<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Réservation — Étape 1</title></head>
<body>
  <main>
    <h1>Réservation</h1>
    <nav aria-label="Étapes">
      <span aria-current="step">Étape 1 / 3 — Vos informations</span>
    </nav>

    {% if error %}
    <p id="error-message" role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/step1">
      <div>
        <label for="name">Prénom et nom</label>
        <input type="text" id="name" name="name" placeholder="Jean Dupont" autocomplete="off">
      </div>
      <div>
        <label for="email">Adresse email</label>
        <input type="text" id="email" name="email" placeholder="jean@example.com" autocomplete="off">
      </div>
      <button type="submit">Étape suivante</button>
    </form>
  </main>
</body>
</html>
