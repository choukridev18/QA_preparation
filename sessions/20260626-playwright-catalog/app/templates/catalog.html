<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Catalogue produits</title></head>
<body>
  <main>
    <h1>Catalogue produits</h1>

    <form method="GET" action="/" id="search-form">
      <label for="q">Rechercher</label>
      <input type="text" id="q" name="q" value="{{ query }}" placeholder="Nom du produit">

      <label for="category">Catégorie</label>
      <select id="category" name="category">
        <option value="">Toutes les catégories</option>
        {% for cat in categories %}
        <option value="{{ cat }}" {% if cat == selected_category %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>

      <button type="submit">Rechercher</button>
      <a href="/" id="reset-link">Réinitialiser</a>
    </form>

    <p id="result-count">{{ total }} produit(s) trouvé(s)</p>

    {% if products %}
    <ul id="product-list">
      {% for product in products %}
      <li id="product-{{ product.id }}">
        <span class="product-name">{{ product.name }}</span>
        <span class="product-category">{{ product.category }}</span>
        <span class="product-price">{{ "%.2f"|format(product.price) }}€</span>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p id="no-results">Aucun produit ne correspond à votre recherche.</p>
    {% endif %}
  </main>
</body>
</html>
