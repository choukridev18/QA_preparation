<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Annuaire</title>
</head>
<body>
  <main>
    <h1>Annuaire</h1>

    <form method="GET" action="/">
      <label for="q">Recherche</label>
      <input type="search" id="q" name="q" value="{{ query }}">
      <button type="submit">Rechercher</button>
    </form>

    {% if results %}
    <ul id="results">
      {% for name in results %}
      <li>{{ name }}</li>
      {% endfor %}
    </ul>
    {% else %}
    <p id="empty-message" role="status">Aucun collègue trouvé.</p>
    {% endif %}
  </main>
</body>
</html>
