<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Connexion</title></head>
<body>
  <main>
    <h1>Connexion</h1>

    {% if error %}
    <p id="error-message" role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
      <div>
        <label for="email">Adresse email</label>
        <input type="text" id="email" name="email" placeholder="admin@example.com" autocomplete="off">
      </div>
      <div>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="Mot de passe" autocomplete="off">
      </div>
      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
