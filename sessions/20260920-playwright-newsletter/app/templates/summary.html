<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Résumé newsletter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Résumé de vos préférences</h1>
    <p>Email : <span id="summary-email">{{ email }}</span></p>
    <p>Catégories : <span id="summary-categories">{{ categories | join(", ") }}</span></p>
    <p>Fréquence : <span id="summary-frequency">{{ frequency }}</span></p>
    <p><a href="/preferences">Modifier les préférences</a></p>
  </main>
</body>
</html>
